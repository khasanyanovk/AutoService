{% extends 'core/base.html' %}
{% load static %}

{% block title %}Удаление марки{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card">
    <div class="card-body">
      <h1 class="h5">Удалить марку «{{ brand.name }}»?</h1>
      <p class="text-muted">Все связанные модели тоже будут удалены.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-end gap-2">
          <a href="{% url 'admin_panel:admin_cars' %}" class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-danger">Удалить</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
