version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoservice_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autoservice}
      POSTGRES_USER: ${DB_USER:-autoservice_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autoservice_user} -d ${DB_NAME:-autoservice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: autoservice_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COLLECTSTATIC=1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; http.client.HTTPConnection('localhost', 8000).request('GET', '/'); exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: autoservice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - app

volumes:
  postgres_data:
  static_volume:
  media_volume: