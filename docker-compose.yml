services:

  caddy:
    image: caddy:latest
    container_name: autoservice_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - autoservice_static_volume:/app/staticfiles:ro
      - autoservice_media_volume:/app/media:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - autoservice_caddy_data:/data:rw
      - autoservice_caddy_config:/config:rw
    networks:
      - autoservice_network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: autoservice_db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - autoservice_postgres_data:/var/lib/postgresql/data
    networks:
      - autoservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autoservice_user} -d ${DB_NAME:-autoservice}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: autoservice_web
    env_file:
      - .env
    command: gunicorn autoservice_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 50
    volumes:
      - autoservice_static_volume:/app/staticfiles
      - autoservice_media_volume:/app/media
    ports:
      - "8000:8000"
    networks:
      - autoservice_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  autoservice_postgres_data:
  autoservice_static_volume:
  autoservice_media_volume:
  autoservice_caddy_data:
  autoservice_caddy_config:

networks:
  autoservice_network:
    driver: bridge