<!DOCTYPE html>
<html lang="ru">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>{% block subject %}{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f8fafc; margin:0; padding:24px; }
    .container { max-width: 680px; margin: 0 auto; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(16,24,40,.06);} 
    .header { background: linear-gradient(90deg,#0d6efd,#4f8cff); color:#fff; padding:18px 24px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-logo { height:36px; width:auto; border-radius:6px; background:rgba(255,255,255,.9); padding:2px; }
    .brand-title { font-weight:700; font-size:16px; letter-spacing:.2px; }
    .header-note { font-size:12px; opacity:.9 }
    .content { padding:24px; color:#212529; }
    .footer { padding:18px 24px; color:#6c757d; font-size:12px; border-top:1px solid #eef2f7; }
    .btn { display:inline-block; background:#0d6efd; color:#fff !important; text-decoration:none; padding:10px 16px; border-radius:8px; box-shadow:0 1px 2px rgba(16,24,40,.1); }
    .muted { color:#6c757d; }
    .card { border:1px solid #eef2f7; border-radius:10px; padding:16px; background:#fff; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; background:#e7f1ff; color:#0d6efd; }
    .kv { width:100%; border-collapse:collapse; }
    .kv th, .kv td { text-align:left; padding:6px 0; font-size:14px; vertical-align:top; }
    .kv th { color:#6c757d; width:160px; font-weight:500; padding-right:12px; }
  </style>
  {% block extra_head %}{% endblock %}
  
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="brand-logo" style="display:flex;align-items:center;justify-content:center;">
          <svg width="36" height="24" viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Car">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" stop-color="#0d6efd"/>
                <stop offset="100%" stop-color="#4f8cff"/>
              </linearGradient>
            </defs>
            <g fill="url(#g)">
              <rect x="10" y="16" rx="4" ry="4" width="44" height="12"/>
              <path d="M14 16c2-6 6-10 12-10h10c3 0 6 2 8 5l2 5H14z"/>
            </g>
            <circle cx="20" cy="30" r="5" fill="#fff"/>
            <circle cx="48" cy="30" r="5" fill="#fff"/>
            <circle cx="20" cy="30" r="3" fill="#0d6efd"/>
            <circle cx="48" cy="30" r="3" fill="#0d6efd"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Починим все</div>
          <div class="header-note">{% block header_note %}{% endblock %}</div>
        </div>
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      Это автоматическое уведомление. Пожалуйста, не отвечайте на это письмо.
    </div>
  </div>
</body>
</html>
