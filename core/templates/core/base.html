<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Починим все - Автосервис{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="/static/core/css/styles.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'core/navbar.html' %}
    {% if messages %}
    <div class="container mt-4">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert" data-aos="fade-down">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'core/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Auto-dismiss alerts
        document.addEventListener('DOMContentLoaded', function () {
            function autoDismissAlert(alertEl, delay) {
                var timeout = typeof delay === 'number' ? delay : 5000;
                setTimeout(function () {
                    try {
                        var bsAlert = bootstrap.Alert.getOrCreateInstance(alertEl);
                        bsAlert.close();
                    } catch (e) {
                        alertEl.classList.remove('show');
                        var removeHandler = function () { try { alertEl.remove(); } catch (_) {} };
                        alertEl.addEventListener('transitionend', removeHandler, { once: true });
                        setTimeout(removeHandler, 700);
                    }
                }, timeout);
            }

            document.querySelectorAll('.alert').forEach(function (alertEl) {
                if (alertEl.classList.contains('alert-sticky') || alertEl.dataset.keep === 'true') return;
                autoDismissAlert(alertEl);
            });

            if (window.MutationObserver) {
                var observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (m) {
                        m.addedNodes && m.addedNodes.forEach(function (node) {
                            if (node.nodeType === 1) {
                                if (node.classList && node.classList.contains('alert')) {
                                    if (!(node.classList.contains('alert-sticky') || node.dataset.keep === 'true')) {
                                        autoDismissAlert(node);
                                    }
                                } else if (node.querySelectorAll) {
                                    node.querySelectorAll('.alert').forEach(function (a) {
                                        if (!(a.classList.contains('alert-sticky') || a.dataset.keep === 'true')) {
                                            autoDismissAlert(a);
                                        }
                                    });
                                }
                            }
                        });
                    });
                });
                observer.observe(document.body, { childList: true, subtree: true });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
